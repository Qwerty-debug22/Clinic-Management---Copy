<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Registration - Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-primary-custom {
            background-color: #0d6efd;
            color: #fff;
        }
    </style>
</head>
<body class="bg-light my-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold text-primary text-center mb-3">Doctor Registration</h3>
                    <form action="{{ url_for('register_doctor') }}" method="POST">
                        <div class="mb-3"><label class="form-label">Doctor Full Name</label><input type="text" name="doctor_name" class="form-control" placeholder="Dr. John Doe" required></div>
                        <div class="mb-3"><label class="form-label">Specialization</label><input type="text" name="specialization" class="form-control" placeholder="General Practitioner" required></div>
                        <div class="mb-3"><label class="form-label">Contact Number</label><input type="text" name="contact_number" class="form-control" required></div>
                        <div class="d-grid gap-2"><button type="submit" class="btn btn-primary-custom fw-bold">Register Doctor</button><a href="{{ url_for('login') }}" class="btn btn-outline-secondary">Back to Login</a></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
