<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Appointment - St. Jude Health Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">St. Jude Health Clinic</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white me-3" href="/appointments"><i class="bi bi-calendar-event"></i> Appointments</a>
                <a class="nav-link text-white fw-bold" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <!-- Flash Error/Success Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <div class="card border-0 shadow">
                    <div class="card-header bg-success text-white py-3 text-center">
                        <h4 class="fw-bold mb-0"><i class="bi bi-calendar-plus"></i> APPOINTMENT SCHEDULING</h4>
                    </div>
                    <div class="card-body p-4">
                        <form action="/appointments/schedule" method="POST">

                            <!-- 1. Select Patient -->
                            <div class="mb-3">
                                <label for="patient_id" class="form-label fw-bold">Patient</label>
                                <select class="form-select" id="patient_id" name="patient_id" required>
                                    <option value="" selected disabled>-- Select Patient --</option>
                                    {% for patient in patients %}
                                    <option value="{{ patient.patient_id }}">
                                        {{ patient.full_name }} ({{ patient.patient_code }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- 2. Select Doctor -->
                            <div class="mb-3">
                                <label for="doctor_id" class="form-label fw-bold">Doctor</label>
                                <select class="form-select" id="doctor_id" name="doctor_id" required>
                                    <option value="" selected disabled>-- Select Doctor --</option>
                                    {% for doctor in doctors %}
                                    <option value="{{ doctor.doctor_id }}">
                                        {{ doctor.doctor_name }} ({{ doctor.specialization }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- 3. Select Date -->
                            <div class="mb-3">
                                <label for="appointment_date" class="form-label fw-bold">Date</label>
                                <input type="date" class="form-control" id="appointment_date" name="appointment_date" required>
                            </div>

                            <!-- 4. Select Time -->
                            <div class="mb-3">
                                <label for="appointment_time" class="form-label fw-bold">Time (Clinic Hours: 08:00 AM - 05:00 PM)</label>
                                <input type="time" class="form-control" id="appointment_time" name="appointment_time" min="08:00" max="17:00" required>
                            </div>

                            <!-- 5. Enter Reason -->
                            <div class="mb-4">
                                <label for="reason" class="form-label fw-bold">Reason</label>
                                <textarea class="form-control" id="reason" name="reason" rows="3" placeholder="e.g. Regular Check-up" required></textarea>
                            </div>

                            <!-- 6. Save Appointment Button -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg fw-bold">
                                    <i class="bi bi-check-circle"></i> SCHEDULE APPOINTMENT
                                </button>
                                <a href="/dashboard/admin" class="btn btn-outline-secondary">Cancel</a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
